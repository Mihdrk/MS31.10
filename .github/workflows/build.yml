name: Biuld Android APK
on:
push:
branches:["main"]
jobs:
biuld:
runs-on: ubuntu-larest
steps:
- name: Checout Code
  uses: actions/checout@v4
- name: Ser up JDK 17
  uses: actions/setup-java@v5
  with:
   distribution: 'temurin'
   java-version: '17'
- name: Setup Gradle
  uses: gradle/actions/setup-gradle@v3
  with:
   gradle-version: '8.5'
- name: Generate Gradle Wrapper
  run: gradle wrapper --gradle--version 8.5
- name: Grant execute permission for gradlew
  run: chmod +x gradlew
- name: Biuld Debug APK
  run: ,/gradlew assembleDebug
- name: Upload APK Artifact
  uses: actions/uplaod-artifact@v4
  with:
  name: app-debug
  path: app/biuld/outputs/apk/debug/*.apk
  
